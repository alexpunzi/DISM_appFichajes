<ion-app>
  <ion-split-pane contentId="main-content">
    @if (authService.user$ | async; as usuario) {
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>{{ usuario.Nombre }}</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          <ion-menu-toggle auto-hide="false">
            <ion-item class="menu-item item-inicio" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/home']">
              <ion-icon slot="start" name="home-outline" color="primary"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>

            <ion-item class="menu-item item-registro" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/registro-fichaje']">
              <ion-icon slot="start" name="time-outline" class="text-fichajes"></ion-icon>
              <ion-label>Registrar fichaje</ion-label>
            </ion-item>

            <ion-item class="menu-item item-consulta" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/consulta-fichajes']">
              <ion-icon slot="start" name="list-outline" class="text-trabajos"></ion-icon>
              <ion-label>Consulta de fichajes</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-item button detail="false" (click)="cerrarSesion()">
            <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ion-menu>
    }

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
