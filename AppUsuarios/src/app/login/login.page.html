<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Fichajes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-wrapper">
    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title class="text-fichajes">Iniciar sesión</ion-card-title>
        <ion-card-subtitle>Introduce tu usuario y contraseña</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form (ngSubmit)="iniciarSesion()">
          <ion-item>
            <ion-input
              label="Usuario"
              labelPlacement="stacked"
              name="usuario"
              autocomplete="username"
              [(ngModel)]="usuario"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              label="Contraseña"
              labelPlacement="stacked"
              name="clave"
              type="password"
              autocomplete="current-password"
              [(ngModel)]="clave"
              required
            ></ion-input>
          </ion-item>

          @if (mensajeError) {
          <p class="error-message" role="alert">{{ mensajeError }}</p>
          }

          <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando">
            {{ cargando ? 'Comprobando...' : 'Entrar' }}
          </ion-button>
        </form>

        @if (authService.sessionError) {
        <ion-button expand="block" fill="clear" (click)="comprobarSesion()">Reintentar comprobación</ion-button>
        }
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
