<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Panel de Control Usuario </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" routerLink="/registro-fichaje">
    Registrar fichaje
  </ion-button>

  <ion-button expand="block" fill="outline" routerLink="/consulta-fichajes">
    Consulta fichajes
  </ion-button>

  <ion-button expand="block" fill="clear" (click)="cerrarSesion()">
    Cerrar sesión
  </ion-button>

  <ion-toast
    [isOpen]="toastAbierto"
    [message]="toastMensaje"
    color="danger"
    duration="3000"
    (didDismiss)="toastAbierto = false"
  ></ion-toast>
</ion-content>
