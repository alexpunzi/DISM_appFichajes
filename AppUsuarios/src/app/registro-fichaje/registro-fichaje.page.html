<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro fichaje</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Registro fichaje</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-item>
    <ion-select label="Trabajo" placeholder="Selecciona un trabajo" [(ngModel)]="trabajoSeleccionado">
      <ion-select-option *ngFor="let trabajo of trabajos" [value]="trabajo.IdTrabajo">
        {{ trabajo.Nombre }}
      </ion-select-option>
    </ion-select>
  </ion-item>
  <ion-button expand="block" [disabled]="trabajoSeleccionado === null" (click)="registrarFichaje()">
    Iniciar fichaje
  </ion-button>
</ion-content>
