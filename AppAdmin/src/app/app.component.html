<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>Panel Admin</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content>
        <ion-list>
          @if (authService.isAdmin) {
          <ion-menu-toggle auto-hide="false">
            <ion-item class="menu-item item-inicio" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/home']">
              <ion-icon slot="start" name="home-outline" color="primary"></ion-icon>
              <ion-label>Inicio</ion-label>
            </ion-item>

            <ion-item class="menu-item item-usuarios" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/gestionusuarios']">
              <ion-icon slot="start" name="people-outline" class="text-usuarios"></ion-icon>
              <ion-label>Gestión de Usuarios</ion-label>
            </ion-item>

            <ion-item class="menu-item item-trabajos" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/gestiontrabajos']">
              <ion-icon slot="start" name="briefcase-outline" class="text-trabajos"></ion-icon>
              <ion-label>Gestión de Trabajos</ion-label>
            </ion-item>

            <ion-item class="menu-item item-fichajes" routerLinkActive="menu-activo" routerDirection="root" [routerLink]="['/gestionfichajes']">
              <ion-icon slot="start" name="time-outline" class="text-fichajes"></ion-icon>
              <ion-label>Gestión de Fichajes</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <ion-item button detail="false" (click)="cerrarSesion()">
            <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
          }
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
